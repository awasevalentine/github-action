name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            awasevalentine/vally:tagname
            awasevalentine/vally:${{ github.sha }}
          
      - name: Verify Docker secrets are set
        run: |
          test -n "${{ secrets.DOCKER_USERNAME }}" || { echo "DOCKER_USERNAME is missing"; exit 1; }
          test -n "${{ secrets.DOCKER_PASSWORD }}" || { echo "DOCKER_PASSWORD is missing"; exit 1; }